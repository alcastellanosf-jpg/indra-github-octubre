<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una página de bienvenida sencilla hecha con HTML, CSS y JavaScript.">
  <title>Mi página web</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#inicio" aria-label="Mi web, ir al inicio">
      <span class="marca-icono" aria-hidden="true">m</span>
      <span class="marca-texto">mi web<span class="marca-punto">.</span></span>
    </a>
    <nav class="navegacion" aria-label="Navegación principal">
      <a class="enlace-inicio" href="#inicio" aria-current="page">Inicio</a>
      <a class="enlace-herramienta" href="#calculadora">Calculadora</a>
    </nav>
  </header>
  <main class="tarjeta" id="inicio">
    <span class="etiqueta">MI PRIMERA WEB</span>
    <h1>¡Hola, mundo!</h1>
    <p class="descripcion">Esta página está hecha con HTML, CSS y JavaScript.</p>
    <p class="mensaje" id="mensaje" aria-live="polite">¡Qué bueno que estés aquí!</p>
    <button id="boton-mensaje" type="button">Ver otro mensaje</button>
  </main>
  <aside class="reloj" id="reloj-analogico" role="img" aria-label="Reloj analógico">
    <div class="esfera" aria-hidden="true">
      <span class="numero numero-12">12</span>
      <span class="numero numero-3">3</span>
      <span class="numero numero-6">6</span>
      <span class="numero numero-9">9</span>
      <span class="aguja aguja-hora" id="aguja-hora"></span>
      <span class="aguja aguja-minuto" id="aguja-minuto"></span>
      <span class="aguja aguja-segundo" id="aguja-segundo"></span>
      <span class="centro"></span>
    </div>
  </aside>
  <section class="calculadora" id="calculadora" aria-label="Calculadora">
    <output class="pantalla-calculadora" id="pantalla-calculadora" aria-live="polite">0</output>
    <div class="teclas-calculadora">
      <button class="tecla tecla-secundaria" type="button" data-accion="limpiar" aria-label="Limpiar">C</button>
      <button class="tecla tecla-secundaria" type="button" data-accion="borrar" aria-label="Borrar último dígito">⌫</button>
      <button class="tecla tecla-operador" type="button" data-operador="/" aria-label="Dividir">÷</button>
      <button class="tecla tecla-operador" type="button" data-operador="*" aria-label="Multiplicar">×</button>
      <button class="tecla" type="button" data-digito="7">7</button>
      <button class="tecla" type="button" data-digito="8">8</button>
      <button class="tecla" type="button" data-digito="9">9</button>
      <button class="tecla tecla-operador" type="button" data-operador="-">−</button>
      <button class="tecla" type="button" data-digito="4">4</button>
      <button class="tecla" type="button" data-digito="5">5</button>
      <button class="tecla" type="button" data-digito="6">6</button>
      <button class="tecla tecla-operador" type="button" data-operador="+">+</button>
      <button class="tecla" type="button" data-digito="1">1</button>
      <button class="tecla" type="button" data-digito="2">2</button>
      <button class="tecla" type="button" data-digito="3">3</button>
      <button class="tecla tecla-igual" type="button" data-accion="calcular" aria-label="Igual">=</button>
      <button class="tecla tecla-cero" type="button" data-digito="0">0</button>
      <button class="tecla" type="button" data-accion="decimal" aria-label="Punto decimal">.</button>
    </div>
  </section>
</body>
</html>
